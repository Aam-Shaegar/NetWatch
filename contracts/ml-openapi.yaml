openapi: 3.1.0
info:
  title: NetWatch internal inference contract
  version: 0.3.0
paths:
  /v1/predict:
    post:
      description: >-
        Worker submits a versioned target and windows. Current Python service
        returns 503 until a validated model exists; no synthetic prediction.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './inference-request.schema.json'}
      responses:
        '200':
          description: Validated model responses matching submitted identities
          content:
            application/json:
              schema: {$ref: './inference-response.schema.json'}
        '503': {description: Validated model unavailable; job must remain retryable}
  /health/live:
    get:
      responses:
        '200': {description: Process alive}
  /health/ready:
    get:
      responses:
        '200': {description: Validated compatible model ready}
        '503': {description: No validated model}
