openapi: 3.1.0
info:
  title: NetWatch ingestion and incident API
  version: 0.5.0
paths:
  /health/live:
    get:
      responses:
        '200': {description: Process is alive}
  /health/ready:
    get:
      responses:
        '200': {description: Ingestion database and schema ready; ML readiness is separate}
        '503': {description: Database or schema unavailable}
  /v1/security/assess:
    post:
      summary: Assess a minute and persist its evidence before acknowledging
      security: [{sensorToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './security-observation.schema.json'}
      responses:
        '200':
          description: Stored observation receipt
          content:
            application/json:
              schema:
                type: object
                required: [id, assessment]
                properties:
                  id: {type: string}
                  assessment: {$ref: './security-assessment.schema.json'}
        '401': {description: Invalid sensor credentials}
        '413': {description: Request exceeds 64 KiB}
        '422': {description: Invalid observation}
        '502': {description: Invalid response from classifier}
        '503': {description: Classification or storage unavailable}
  /v1/security/observations:
    post:
      summary: Commit a minute observation and queue background assessment
      security: [{sensorToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './security-observation.schema.json'}
      responses:
        '202':
          description: Durable job receipt; equal submissions return the same job ID
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: {type: string}
        '401': {description: Invalid sensor credentials}
        '413': {description: Request exceeds 64 KiB}
        '422': {description: Invalid observation}
        '503': {description: Storage unavailable}
    get:
      summary: Review observations and findings in descending receipt order
      security: [{operatorToken: []}]
      parameters:
        - {in: query, name: before, schema: {type: integer, minimum: 0}}
        - {in: query, name: entity, schema: {type: string}}
      responses:
        '200': {description: Up to 50 observations with evidence and next page cursor}
        '400': {description: Invalid cursor}
        '401': {description: Invalid operator credentials}
        '503': {description: Storage unavailable}
  /v1/security/observations/{job_id}:
    get:
      summary: Read the status of a job owned by the calling sensor
      security: [{sensorToken: []}]
      parameters:
        - {in: path, name: job_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Job state and optional assessment and observation ID}
        '401': {description: Invalid sensor credentials}
        '404': {description: Job absent or outside the sensor's scope}
        '503': {description: Storage unavailable}
  /v1/windows:
    post:
      summary: Atomic window delivery contract
      description: >-
        Receiver authenticates the sensor and validates all windows before storage.
        A 200 ACK follows durable commit of all new events and inference jobs. Duplicate event IDs with
        identical content are successful; conflicting content is a 409 error.
        Maximum request body is 2 MiB; batch has at most 100 windows.
      security: [{sensorToken: []}]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './batch.schema.json'}
      responses:
        '200':
          description: All event IDs durably committed, including identical duplicates
          content:
            application/json:
              schema: {$ref: './ack.schema.json'}
        '400': {description: Invalid envelope; nothing committed}
        '401': {description: Invalid or missing sensor token; nothing committed}
        '403': {description: Sensor not authorized; nothing committed}
        '409': {description: Existing event ID has conflicting content; nothing committed}
        '413': {description: Request too large; nothing committed}
        '415': {description: Content-Type must be application/json}
        '422':
          description: Atomic rejection; zero-based error_index identifies an invalid window; nothing committed
          content:
            application/json:
              schema: {$ref: './rejection.schema.json'}
        '429': {description: Retry after backoff; no acknowledgment}
        '503': {description: Temporarily unavailable; no acknowledgment}
  /v1/windows/{event_id}:
    get:
      security: [{sensorToken: []}]
      parameters:
        - {in: path, name: event_id, required: true, schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: Stored window in the authenticated sensor scope
          content:
            application/json:
              schema: {$ref: './window.schema.json'}
        '401': {description: Invalid sensor token}
        '404': {description: Window absent or belongs to another sensor}
        '503': {description: Storage unavailable}
  /v1/predictions/{event_id}:
    get:
      security: [{sensorToken: []}]
      parameters:
        - {in: path, name: event_id, required: true, schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: At most 100 stored predictions with policy_version and processed_at; empty while pending or out of scope
          content:
            application/json:
              schema:
                type: object
                required: [predictions]
                properties:
                  predictions:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [prediction, policy_version, processed_at]
                      properties:
                        prediction: {$ref: './prediction.schema.json'}
                        policy_version: {type: string}
                        processed_at: {type: string, format: date-time}
        '401': {description: Invalid sensor token}
        '503': {description: Storage unavailable}
  /v1/pipeline/status:
    get:
      summary: Inspect capture freshness, active detector output and durable queues
      security: [{operatorToken: []}]
      responses:
        '200':
          description: Operational snapshot with event and receipt times separated
          content:
            application/json:
              schema:
                type: object
                required: [observed_at, target, capture, prediction, usable_prediction, inference, assessment, projection_pending, projection_oldest_age_s, projection_gaps]
                properties:
                  observed_at: {type: string, format: date-time}
                  target:
                    type: object
                    required: [model_id, policy_version]
                    properties:
                      model_id: {type: string}
                      policy_version: {type: string}
                  capture:
                    type: [object, 'null']
                    description: Most recently received window and its recorded capture quality
                  prediction:
                    type: [object, 'null']
                    description: Most recent prediction for the active model and policy, including abstention
                  usable_prediction:
                    type: [object, 'null']
                    description: Latest normal or anomalous prediction and the age of its source event
                  inference: {type: object}
                  assessment: {type: object}
                  projection_pending: {type: integer, minimum: 0}
                  projection_oldest_age_s: {type: [number, 'null']}
                  projection_gaps: {type: integer, minimum: 0}
        '401': {description: Invalid operator credentials}
        '503': {description: Storage unavailable}
  /v1/pilots/{name}/start:
    parameters:
      - {$ref: '#/components/parameters/pilotName'}
    post:
      summary: Start a seven-day pilot with the active model and policy
      description: Reusing the name returns the original observation period and model.
      security: [{operatorToken: []}]
      responses:
        '200':
          description: Pilot observation period
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PilotPeriod'}
        '400': {description: Invalid pilot name}
        '401': {description: Operator credentials required}
        '503': {description: Storage unavailable}
  /v1/pilots/{name}/report:
    parameters:
      - {$ref: '#/components/parameters/pilotName'}
    get:
      summary: Read the pilot report, including registered sensors that sent no observations
      description: >-
        Metrics cover elapsed observation time up to the earlier of database time and the end
        of the pilot. Later arrivals and reference labels may update a completed period's report.
      security: [{operatorToken: []}]
      responses:
        '200':
          description: Per-sensor statistics and analyzer measurements
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PilotReport'}
        '400': {description: Invalid pilot name}
        '401': {description: Operator credentials required}
        '404': {description: Pilot not found}
        '503': {description: Storage unavailable or report deadline exceeded}
  /v1/pilots/{name}/labels:
    parameters:
      - {$ref: '#/components/parameters/pilotName'}
    post:
      summary: Register an independently labeled interval for one sensor
      description: >-
        The half-open interval must fall within elapsed pilot time after sensor registration and before any revocation.
        Intervals for a given sensor and pilot cannot overlap. An identical retry succeeds.
        Maximum request size is 4096 bytes.
      security: [{operatorToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PilotLabel'}
      responses:
        '200':
          description: Accepted reference interval
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PilotLabel'}
        '400': {description: Invalid pilot request}
        '401': {description: Operator credentials required}
        '404': {description: Pilot or sensor not found}
        '409': {description: Reused event ID with different content or overlapping interval}
        '503': {description: Storage unavailable}
  /v1/incidents:
    get:
      summary: List incidents in descending ID order
      security: [{operatorToken: []}]
      parameters:
        - {in: query, name: entity, schema: {type: string, maxLength: 800}}
        - {in: query, name: model, schema: {type: string, maxLength: 200}}
        - {in: query, name: from, description: Inclusive detection time in epoch nanoseconds, schema: {type: integer, minimum: 0}}
        - {in: query, name: until, description: Exclusive detection time in epoch nanoseconds (zero disables bound), schema: {type: integer, minimum: 0}}
        - {in: query, name: before, description: Exclusive incident ID cursor, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: Page and pipeline-wide pending and retry indicators
          content:
            application/json:
              schema:
                type: object
                required: [incidents, next, pending, retrying]
                properties:
                  incidents: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/Incident'}}
                  next: {type: string, description: Empty on last page}
                  pending: {type: boolean}
                  retrying: {type: boolean}
                  failed: {type: boolean, description: A terminal inference error was recorded}
        '400': {description: Invalid filter or cursor}
        '401': {description: Operator credentials required}
        '503': {description: Storage unavailable}
  /v1/incidents/{id}:
    parameters:
      - {$ref: '#/components/parameters/incidentID'}
    get:
      security: [{operatorToken: []}]
      parameters:
        - {in: query, name: after, description: Exclusive start_ns of previous evidence page, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: Chronological evidence and incident metadata
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, feature_set_version, rule, incident, events, more]
                properties:
                  schema_version: {const: 1}
                  feature_set_version: {enum: [traffic-v1, traffic-v2]}
                  rule: {type: string}
                  incident: {$ref: '#/components/schemas/Incident'}
                  events:
                    type: array
                    maxItems: 200
                    items:
                      type: object
                      required: [event, kind, start_ns, end_ns, features, quality, prediction]
                      properties:
                        event: {type: string}
                        kind: {enum: [opened, signal, observed, unknown, closed]}
                        start_ns: {type: string}
                        end_ns: {type: string}
                        features: {type: object}
                        quality: {type: object}
                        prediction: {$ref: './prediction.schema.json'}
                  more: {type: boolean}
        '400': {description: Invalid ID or cursor}
        '401': {description: Operator credentials required}
        '404': {description: Incident absent}
        '503': {description: Storage unavailable}
  /v1/incidents/{id}/ack:
    parameters:
      - {$ref: '#/components/parameters/incidentID'}
    post:
      security: [{operatorToken: []}]
      summary: Record first acknowledgement using authenticated actor
      responses:
        '204': {description: Acknowledgement durably recorded or previously present}
        '400': {description: Invalid ID}
        '401': {description: Operator credentials required}
        '404': {description: Incident absent}
        '503': {description: Storage unavailable}
components:
  parameters:
    pilotName: {in: path, name: name, required: true, schema: {$ref: '#/components/schemas/PilotName'}}
    incidentID: {in: path, name: id, required: true, schema: {type: integer, minimum: 1}}
  schemas:
    PilotName:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
    PilotPeriod:
      type: object
      required: [name, started_at, ends_at, model_id, policy_version]
      properties:
        name: {$ref: '#/components/schemas/PilotName'}
        started_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time, description: Exactly 168 hours after start}
        model_id: {type: string}
        policy_version: {type: string}
    PilotLabel:
      type: object
      additionalProperties: false
      required: [id, sensor_id, start, end, type]
      properties:
        id: {$ref: '#/components/schemas/PilotName'}
        sensor_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'}
        start: {type: string, format: date-time, description: Inclusive with at most microsecond precision}
        end: {type: string, format: date-time, description: Exclusive with at most microsecond precision}
        type: {enum: [normal, tcp_port_scan, udp_flood, icmp_flood, unknown]}
    PilotReport:
      allOf:
        - {$ref: '#/components/schemas/PilotPeriod'}
        - type: object
          required: [as_of, complete, sensors, analyzer]
          properties:
            as_of: {type: string, format: date-time, description: Upper bound for observation time}
            complete: {type: boolean, description: Whether the seven-day observation period has elapsed}
            sensors:
              type: array
              items: {$ref: '#/components/schemas/PilotSensorReport'}
            analyzer:
              type: object
              required: [samples, peak_queue, database_growth_bytes]
              properties:
                samples: {type: integer, minimum: 0}
                peak_queue: {type: [integer, 'null'], minimum: 0}
                database_growth_bytes: {type: [integer, 'null'], description: Signed change in database size}
    PilotSensorReport:
      type: object
      required: [sensor_id, expected_slots, received_slots, usable_slots, received_windows,
        insufficient_windows, unresolved_windows, alert_windows, incidents, by_type, by_source,
        coverage_pct, p95_delay_s, resource_samples, mean_cpu_pct, peak_rss_bytes, reference]
      properties:
        sensor_id: {type: string}
        expected_slots: {type: integer, minimum: 0, description: Full aligned five-second intervals between enrollment or pilot start and revocation or report cutoff}
        received_slots: {type: integer, minimum: 0, description: Distinct intervals observed}
        usable_slots: {type: integer, minimum: 0, description: Distinct intervals with a normal or incident decision}
        received_windows: {type: integer, minimum: 0, description: Window count across capture epochs}
        insufficient_windows: {type: integer, minimum: 0}
        unresolved_windows: {type: integer, minimum: 0}
        alert_windows: {type: integer, minimum: 0}
        incidents: {type: integer, minimum: 0, description: Distinct incidents linked to the selected windows}
        by_type: {type: object, additionalProperties: {type: integer, minimum: 0}}
        by_source: {type: object, additionalProperties: {type: integer, minimum: 0}}
        coverage_pct: {type: [number, 'null'], minimum: 0, maximum: 100, description: Usable slots as a percentage of expected slots}
        p95_delay_s: {type: [number, 'null'], description: 95th percentile from window end to usable decision}
        resource_samples: {type: integer, minimum: 0}
        mean_cpu_pct: {type: [number, 'null'], minimum: 0}
        peak_rss_bytes: {type: [integer, 'null'], minimum: 0}
        reference:
          description: Metrics for completed independently labeled intervals, or null if none exist.
          oneOf:
            - {$ref: '#/components/schemas/PilotReference'}
            - {type: 'null'}
    PilotReference:
      type: object
      required: [attack_episodes, detected_episodes, correctly_typed_episodes, by_type, normal_slots, false_incidents, false_per_100h]
      properties:
        attack_episodes: {type: integer, minimum: 0}
        detected_episodes: {type: integer, minimum: 0}
        correctly_typed_episodes: {type: integer, minimum: 0}
        by_type:
          type: object
          additionalProperties:
            type: object
            required: [total, detected, correct]
            properties:
              total: {type: integer, minimum: 0}
              detected: {type: integer, minimum: 0}
              correct: {type: integer, minimum: 0}
        normal_slots: {type: integer, minimum: 0, description: Distinct usable five-second slots fully inside a normal reference interval}
        false_incidents: {type: integer, minimum: 0, description: Distinct incidents contained in a normal reference interval}
        false_per_100h: {type: [number, 'null'], minimum: 0, description: False incidents per 100 usable normal host-hours}
    Incident:
      type: object
      required: [id, sensor, epoch, entity_type, entity, model, policy, first_ns, detected_ns, detected_at, last_ns, closed_ns, ack_at, ack_by]
      properties:
        id: {type: string}
        sensor: {type: string}
        epoch: {type: string}
        entity_type: {type: string}
        entity: {type: string}
        model: {type: string}
        policy: {type: string}
        first_ns: {type: string}
        detected_ns: {type: string}
        detected_at: {type: string, format: date-time}
        last_ns: {type: string}
        closed_ns: {type: [string, 'null']}
        estimated_end_ns: {type: [string, 'null']}
        interrupted_ns: {type: [string, 'null']}
        closed_at: {type: [string, 'null'], format: date-time}
        ack_at: {type: [string, 'null'], format: date-time}
        ack_by: {type: [string, 'null']}
  securitySchemes:
    operatorToken: {type: http, scheme: bearer}
    sensorToken:
      type: http
      scheme: bearer
