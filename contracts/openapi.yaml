openapi: 3.1.0
info:
  title: NetWatch ingestion API
  version: 0.3.0
paths:
  /health/live:
    get:
      responses:
        '200': {description: Process is alive}
  /health/ready:
    get:
      responses:
        '200': {description: Ingestion database and schema ready; ML readiness is separate}
        '503': {description: Database or schema unavailable}
  /v1/windows:
    post:
      summary: Atomic window delivery contract
      description: >-
        Receiver authenticates the sensor and validates all windows before storage.
        A 200 ACK follows durable commit of all new events and inference jobs. Duplicate event IDs with
        identical content are successful; conflicting content is a 409 error.
        Maximum request body is 2 MiB; batch has at most 100 windows.
      security: [{sensorToken: []}]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './batch.schema.json'}
      responses:
        '200':
          description: All event IDs durably committed, including identical duplicates
          content:
            application/json:
              schema: {$ref: './ack.schema.json'}
        '400': {description: Invalid envelope; nothing committed}
        '401': {description: Invalid or missing sensor token; nothing committed}
        '403': {description: Sensor not authorized; nothing committed}
        '409': {description: Existing event ID has conflicting content; nothing committed}
        '413': {description: Request too large; nothing committed}
        '415': {description: Content-Type must be application/json}
        '422':
          description: Atomic rejection; zero-based error_index identifies an invalid window; nothing committed
          content:
            application/json:
              schema: {$ref: './rejection.schema.json'}
        '429': {description: Retry after backoff; no acknowledgment}
        '503': {description: Temporarily unavailable; no acknowledgment}
  /v1/windows/{event_id}:
    get:
      security: [{sensorToken: []}]
      parameters:
        - {in: path, name: event_id, required: true, schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: Stored window in the authenticated sensor scope
          content:
            application/json:
              schema: {$ref: './window.schema.json'}
        '401': {description: Invalid sensor token}
        '404': {description: Window absent or belongs to another sensor}
        '503': {description: Storage unavailable}
  /v1/predictions/{event_id}:
    get:
      security: [{sensorToken: []}]
      parameters:
        - {in: path, name: event_id, required: true, schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: At most 100 stored predictions with policy_version and processed_at; empty while pending or out of scope
          content:
            application/json:
              schema:
                type: object
                required: [predictions]
                properties:
                  predictions:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [prediction, policy_version, processed_at]
                      properties:
                        prediction: {$ref: './prediction.schema.json'}
                        policy_version: {type: string}
                        processed_at: {type: string, format: date-time}
        '401': {description: Invalid sensor token}
        '503': {description: Storage unavailable}
components:
  securitySchemes:
    sensorToken:
      type: http
      scheme: bearer
