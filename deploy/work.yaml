name: netwatch

x-go: &go
  image: ${NETWATCH_GO_IMAGE:-netwatch-go:local}
  cap_drop: [ALL]
  read_only: true
  security_opt: [no-new-privileges:true]
  networks: [backend]
  logging: &logging
    driver: local
    options:
      max-size: 20m
      max-file: "5"

x-db-env: &db-env
  NETWATCH_DATABASE_URL: ${NETWATCH_DATABASE_URL:?Set the runtime PostgreSQL URL using the db service name}

services:
  db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: netwatch
      POSTGRES_USER: ${NETWATCH_DB_USER:-netwatch}
      POSTGRES_PASSWORD: ${NETWATCH_DB_PASSWORD:?Set the PostgreSQL bootstrap password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
    logging: *logging

  migrate:
    <<: *go
    build:
      context: ..
      dockerfile: deploy/go/Dockerfile
    command: ["/usr/local/bin/netwatch-api", "-migrate-only"]
    depends_on:
      db: {condition: service_healthy}
    environment:
      NETWATCH_DATABASE_URL: ${NETWATCH_MIGRATION_DATABASE_URL:-${NETWATCH_DATABASE_URL}}
    restart: "no"

  api:
    <<: *go
    networks: [backend, ingress]
    depends_on:
      migrate: {condition: service_completed_successfully}
      db: {condition: service_healthy}
    environment:
      <<: *db-env
      NETWATCH_LISTEN: 0.0.0.0:8443
      NETWATCH_API_HEALTH_ADDRESS: 127.0.0.1:8091
      NETWATCH_PRIVATE_COMPOSE: "true"
      NETWATCH_SECURITY_ENDPOINT: http://ml:8000/v1/security/assess
      NETWATCH_WEB_DIR: /srv/netwatch/web
      NETWATCH_TLS_CERT: /run/netwatch/tls/cert.pem
      NETWATCH_TLS_KEY: /run/netwatch/tls/key.pem
      NETWATCH_SENSOR_TOKENS: ${NETWATCH_SENSOR_TOKENS:?Set a JSON map of sensor IDs to tokens}
      NETWATCH_OPERATOR_TOKENS: ${NETWATCH_OPERATOR_TOKENS:?Set a JSON map of operator IDs to tokens}
      NETWATCH_MODEL_ID: ${NETWATCH_MODEL_ID:?Set the approved model identifier}
      NETWATCH_POLICY_VERSION: ${NETWATCH_POLICY_VERSION:-v1}
      NETWATCH_LOG_LEVEL: ${NETWATCH_LOG_LEVEL:-info}
    volumes:
      - type: bind
        source: ${NETWATCH_TLS_DIR:?Set directory containing cert.pem and key.pem}
        target: /run/netwatch/tls
        read_only: true
        bind: {create_host_path: false}
    ports:
      - "${NETWATCH_API_HOST:-127.0.0.1}:${NETWATCH_API_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/netwatch-api", "-check-ready"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 15s

  worker:
    <<: *go
    command: ["/usr/local/bin/netwatch-worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      ml: {condition: service_healthy}
    environment:
      <<: *db-env
      NETWATCH_WORKER_HEALTH_ADDRESS: 127.0.0.1:8090
      NETWATCH_INCIDENT_GAP_WAIT: ${NETWATCH_INCIDENT_GAP_WAIT:-2m}
      NETWATCH_PRIVATE_COMPOSE: "true"
      NETWATCH_ML_ENDPOINT: http://ml:8000/v1/predict
      NETWATCH_SECURITY_ENDPOINT: http://ml:8000/v1/security/assess
      NETWATCH_MODEL_ID: ${NETWATCH_MODEL_ID:?Set the approved model identifier}
      NETWATCH_LOG_LEVEL: ${NETWATCH_LOG_LEVEL:-info}
      NETWATCH_POLICY_VERSION: ${NETWATCH_POLICY_VERSION:-v1}
    healthcheck:
      test: ["CMD", "/usr/local/bin/netwatch-worker", "-check-ready"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 20s

  ml:
    image: ${NETWATCH_ML_IMAGE:-netwatch-ml:local}
    build:
      context: ..
      dockerfile: deploy/ml/Dockerfile
    environment:
      NETWATCH_MODEL_ID: ${NETWATCH_MODEL_ID:?Set the approved model identifier}
      NETWATCH_MODEL_BUNDLE: /model/bundle.json
      NETWATCH_MODEL_SHA256: ${NETWATCH_MODEL_SHA256:?Set the approved bundle SHA-256}
      NETWATCH_FEATURE_SET_VERSION: ${NETWATCH_CAPTURE_FEATURE_SET:-traffic-v1}
      NETWATCH_POLICY_VERSION: ${NETWATCH_POLICY_VERSION:-v1}
      NETWATCH_SERVICE_MODEL_ENTITIES: ${NETWATCH_SERVICE_MODEL_ENTITIES:?Set the approved service identifiers}
      NETWATCH_LOG_LEVEL: ${NETWATCH_LOG_LEVEL:-info}
    volumes:
      - type: bind
        source: ${NETWATCH_MODEL_DIR:?Set directory containing the approved bundle.json}
        target: /model
        read_only: true
        bind: {create_host_path: false}
    networks: [backend]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import json, os, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=1))['model_id'] == os.environ['NETWATCH_MODEL_ID']"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *logging

  sensor:
    profiles: [sensor]
    image: ${NETWATCH_SENSOR_IMAGE:-netwatch-sensor:local}
    build:
      context: ..
      dockerfile: deploy/sensor/Dockerfile
    network_mode: host
    depends_on:
      api: {condition: service_healthy}
    command:
      - live
      - --interface
      - "${NETWATCH_CAPTURE_INTERFACE:-}"
      - --filter
      - "${NETWATCH_CAPTURE_FILTER:-}"
      - --capture-buffer-mib
      - "${NETWATCH_CAPTURE_BUFFER_MIB:-16}"
      - --service
      - "${NETWATCH_CAPTURE_SERVICE:-}"
      - --feature-set
      - "${NETWATCH_CAPTURE_FEATURE_SET:-traffic-v1}"
      - --lateness
      - "${NETWATCH_CAPTURE_LATENESS:-1s}"
      - --sensor
      - "${NETWATCH_CAPTURE_SENSOR:-live}"
      - --spool
      - /spool
      - --endpoint
      - "${NETWATCH_SENSOR_ENDPOINT:-}"
    environment:
      NETWATCH_SENSOR_TOKEN: ${NETWATCH_SENSOR_TOKEN:-}
      NETWATCH_SENSOR_CA_PEM: ${NETWATCH_SENSOR_CA_PEM:-}
      NETWATCH_LOG_LEVEL: ${NETWATCH_LOG_LEVEL:-info}
    volumes: [spool:/spool]
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    read_only: true
    security_opt: [no-new-privileges:true]
    logging: *logging
    restart: unless-stopped
    stop_grace_period: 15s

  probe:
    <<: *go
    profiles: [probe]
    networks: [ingress]
    command:
      - /usr/local/bin/netwatch-probe
      - -url
      - "${NETWATCH_PROBE_URL:-}"
      - -entity
      - "${NETWATCH_PROBE_ENTITY:-}"
      - -cohort
      - "${NETWATCH_PROBE_COHORT:-}"
      - -start
      - "${NETWATCH_PROBE_START:-0}"
      - -policy-valid-until
      - "${NETWATCH_PROBE_POLICY_VALID_UNTIL:-0}"
    restart: "no"

networks:
  backend:
    internal: true
  ingress: {}

volumes:
  pgdata:
  spool:
